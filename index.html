<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Games Site</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>My Games Site 🎮</h1>
    <p>Click a game to play!</p>
  </header>

  <main id="game-list"></main>

  <script>
    fetch("games.json")
      .then(res => res.json())
      .then(games => {
        const list = document.getElementById("game-list");
        games.forEach(game => {
          const card = document.createElement("div");
          card.className = "game-card";
          card.innerHTML = `
            <a href="play.html?game=${encodeURIComponent(game.filename)}">
              <img src="${game.image}" alt="${game.title}">
              <h3>${game.title}</h3>
            </a>
          `;
          list.appendChild(card);
        });
      });
  </script>
</body>
</html>
