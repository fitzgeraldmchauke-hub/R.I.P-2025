<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Recorder</title>
<style>
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }

  .card {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
  }

  h1 {
    margin-top: 0;
    font-size: 24px;
  }

  .buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 20px;
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #startBtn { background: #22c55e; color: #fff; }
  #stopBtn { background: #ef4444; color: #fff; }
  #downloadBtn { background: #3b82f6; color: #fff; }

  audio {
    width: 100%;
    margin-top: 20px;
  }

  .status {
    margin-top: 15px;
    font-size: 14px;
    color: #555;
  }

  .error {
    margin-top: 15px;
    font-size: 14px;
    color: #dc2626;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🎙️ Voice Recorder</h1>
  <p class="status" id="statusText">Ready to record</p>

  <div class="buttons">
    <button id="startBtn">Record</button>
    <button id="stopBtn" disabled>Stop</button>
    <a id="downloadBtn" disabled><button disabled>Download</button></a>
  </div>

  <audio id="audioPlayback" controls></audio>
  <div id="errorMsg" class="error"></div>
</div>

<script>
let mediaRecorder;
let audioChunks = [];

const startBtn = document.getElementById('startBtn');
const stopBtn = document.getElementById('stopBtn');
const downloadBtn = document.getElementById('downloadBtn');
const audioPlayback = document.getElementById('audioPlayback');
const errorMsg = document.getElementById('errorMsg');
const statusText = document.getElementById('statusText');

function requireSecureContext() {
  if (!window.isSecureContext) {
    errorMsg.textContent = 'Microphone access requires HTTPS or localhost.';
    startBtn.disabled = true;
    return false;
  }
  return true;
}

startBtn.addEventListener('click', async () => {
  errorMsg.textContent = '';
  if (!requireSecureContext()) return;

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream);

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      const blob = new Blob(audioChunks, { type: 'audio/webm; codecs=opus' });
      const url = URL.createObjectURL(blob);
      audioPlayback.src = url;
      downloadBtn.href = url;
      downloadBtn.download = 'recording.webm';
      downloadBtn.querySelector('button').disabled = false;
      statusText.textContent = 'Recording complete';
    };

    mediaRecorder.start();
    startBtn.disabled = true;
    stopBtn.disabled = false;
    downloadBtn.querySelector('button').disabled = true;
    statusText.textContent = 'Recording…';
  } catch (err) {
    if (err.name === 'NotAllowedError') {
      errorMsg.textContent = 'Microphone permission denied.';
    } else {
      errorMsg.textContent = 'Error: ' + err.message;
    }
  }
});

stopBtn.addEventListener('click', () => {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  startBtn.disabled = false;
  stopBtn.disabled = true;
});
</script>

</body>
</html>
