<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live-Sync Editor</title>
<style>
  body { font-family: Arial; padding: 20px; }
  #content { width: 100%; height: 300px; padding: 10px; font-size: 16px; }
</style>
</head>
<body>

<h2>Live-Sync Editor</h2>
<p>Type below. Your changes appear instantly in other tabs on the same device.</p>
<textarea id="content" placeholder="Start typing..."></textarea>

<script>
  const textarea = document.getElementById('content');
  const STORAGE_KEY = 'liveContent';

  // Load saved content on page load
  window.onload = () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) textarea.value = saved;
  };

  // Save content as user types
  textarea.addEventListener('input', () => {
    localStorage.setItem(STORAGE_KEY, textarea.value);
  });

  // Listen for changes from other tabs
  window.addEventListener('storage', (event) => {
    if (event.key === STORAGE_KEY && event.newValue !== textarea.value) {
      textarea.value = event.newValue;
    }
  });

</script>

</body>
</html>
